services:
  linkpark:
    image: ${LINKPARK_IMAGE_OWNER:-linkpark}/linkpark:latest
    container_name: linkpark
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      LINKPARK_TOKEN: ${LINKPARK_TOKEN:?set LINKPARK_TOKEN in .env (at least 16 chars)}
    volumes:
      - ./data:/data
